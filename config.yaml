llm_settings:
  provider: "openai" # "openai" or "google"
  temperature: 0.0
  openai:
    model: "gpt-4o-mini"
    embedding_model: "text-embedding-3-small"
  google:
    model: "models/gemini-pro-latest"
    embedding_model: "models/embedding-001"

rag_settings:
  chunk_size: 1200
  chunk_overlap: 300
  document_language: "Spanish" # Any language, e.g. "Spanish", "English", "German", "French"
  # L2 distance threshold: chunks with score > threshold are discarded before reranking.
  # For normalised OpenAI embeddings, L2=1.0 ≈ cosine_sim=0.5 (reasonable relevance).
  # Increase (e.g. 1.5) to be more permissive; decrease (e.g. 0.8) for stricter filtering.
  # L2 distance threshold. Raised to 1.8 to avoid filtering valid Spanish chunks —
  # cross-lingual embeddings (Spanish doc vs. English query) produce higher L2 distances
  # than monolingual pairs. Only discard true noise (score > 1.8 ≈ cosine_sim < -0.62).
  retrieval_score_threshold: 1.8
  # Set to false to skip the regulations index entirely (saves ~1500 tokens/row).
  # When false, the LLM relies on its training knowledge for regulatory context.
  use_regulations: false
  # Chunks from client docs guaranteed in context regardless of reranking.
  # Prevents regulation docs from crowding out client policy pages.
  client_top_k: 6
  # Chunks from regulation docs (capped to avoid flooding client context).
  regs_top_k: 2
  # Final chunk count passed to the LLM after reranking (client + regs combined).
  rerank_top_k: 7
  # Multilingual MS MARCO reranker — handles Spanish, English, and mixed pairs.
  # Downloads ~270MB on first use. Substantially better than stsb-roberta-base for Spanish.
  reranker_model: "cross-encoder/mmarco-mMiniLMv2-L12-H384-v1"

paths:
  input_csv: "inputs/rcm_input.csv"
  output_json: "outputs/audit_results.json"   # fallback for notebook; run_audit.py uses run folder
  documents_folder: "documents/"
  expert_answers_csv: "inputs/rcm_expert_answer.csv"
  validation_report_csv: "outputs/val_metrics.csv"  # fallback for notebook; run_audit.py uses run folder

judge_llm:
  # Which provider to use as the independent judge LLM.
  # Options:
  #   "auto"     — try providers in auto_order below; first available wins
  #   "ollama"   — force local Ollama (must be running); unlimited tokens, fully private
  #   "groq"     — force Groq cloud (needs GROQ_API_KEY); fast, ~100k tokens/day free
  #   "together" — force Together AI (needs TOGETHER_API_KEY); free model available
  #   "openai"   — use the primary OpenAI model as judge (least independent)
  #   "google"   — use the primary Google/Gemini model as judge (least independent)
  provider: "auto"
  # Priority order when provider is "auto". First available provider wins.
  # Reorder this list to change preference.
  auto_order:
    - "groq"
    - "ollama"
    - "together"

  # Model names per provider:
  model: "llama-3.3-70b-versatile"                        # Groq
  together_model: "meta-llama/Llama-3.3-70B-Instruct-Turbo-Free"  # Together AI
  ollama_model: "llama3.1:8b"                              # Ollama local model
  ollama_base_url: "http://localhost:11434"

validation:
  enable_self_critique: false
  # Use the secondary LLM provider to independently grade the answer.
  # Requires both OPENAI_API_KEY and GEMINI_API_KEY to be set in .env.
  enable_cross_llm_critique: true
  # Confidence score below this value (0-100) will flag the control for human review.
  confidence_threshold: 60.0

audit_trail:
  enabled: true
  # Intrinsic critique score (0-10) below this will flag the control for human review.
  flag_score_threshold: 6

filtering:
  tier: '1' # Can be 'all', or a specific tier like 1, 2, or 3
  # Weights used for risk-weighted compliance scoring in the validation report.
  tier_weights:
    '1': 3
    '2': 2
    '3': 1
